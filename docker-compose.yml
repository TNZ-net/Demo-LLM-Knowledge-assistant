services:
  db:
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: knowledge_assistant
    volumes:
      - dbdata:/var/lib/postgresql
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d knowledge_assistant"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD}@db:5432/knowledge_assistant
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      OLLAMA_URL: http://host.docker.internal:11434/api/chat
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  dbdata: